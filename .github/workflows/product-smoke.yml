# Product path smoke (platform + node4) + beta deploy contract (Spec #231 / Phase A #239).
# Does not scan research/ or legacy node trees. No LLM keys. Gates beta-deploy on main push.
name: product-smoke

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "node4/**"
      - "experts/**"
      - "shared/**"
      - "deploy/**"
      - "scripts/beta-deploy.sh"
      - "scripts/beta-fe-env.sh"
      - "scripts/check-beta-deploy-contract.sh"
      - "docs/deploy/**"
      - "docs/specs/ci-cd.md"
      - ".github/workflows/product-smoke.yml"
      - ".github/workflows/beta-deploy.yml"
      - ".github/workflows/product-deep.yml"
  pull_request:
    paths:
      - "platform/**"
      - "node4/**"
      - "experts/**"
      - "shared/**"
      - "deploy/**"
      - "scripts/beta-deploy.sh"
      - "scripts/beta-fe-env.sh"
      - "scripts/check-beta-deploy-contract.sh"
      - "docs/deploy/**"
      - "docs/specs/ci-cd.md"
      - ".github/workflows/product-smoke.yml"
      - ".github/workflows/beta-deploy.yml"
      - ".github/workflows/product-deep.yml"

jobs:
  beta-deploy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check beta deploy contract (Seam 1)
        run: bash scripts/check-beta-deploy-contract.sh

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: npm ci
      - name: Pure unit tests (no browser)
        run: npm run test:unit
      - run: npm run build

  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Python (project pin)
        run: uv python install
      - name: Sync deps (incl. pytest dev)
        run: uv sync --group dev
      - name: Unit tests (no external services)
        run: uv run pytest tests/ -q

  node4-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: node4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node4/package-lock.json
      - run: npm ci
      - name: Phase A allowlist (deterministic, no LLM)
        run: npm run test:ci-pr
      - name: Node4 smoke entrypoint
        run: npx tsx src/node4-smoke.ts
        env:
          CI: "1"
