# Product path smoke (platform + node4) + beta deploy contract (Spec #231).
# Does not scan research/ or legacy node trees.
name: product-smoke

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "node4/**"
      - "experts/**"
      - "deploy/**"
      - "scripts/beta-deploy.sh"
      - "scripts/beta-fe-env.sh"
      - "scripts/check-beta-deploy-contract.sh"
      - "docs/deploy/**"
      - "docs/specs/ci-cd.md"
      - ".github/workflows/product-smoke.yml"
      - ".github/workflows/beta-deploy.yml"
  pull_request:
    paths:
      - "platform/**"
      - "node4/**"
      - "experts/**"
      - "deploy/**"
      - "scripts/beta-deploy.sh"
      - "scripts/beta-fe-env.sh"
      - "scripts/check-beta-deploy-contract.sh"
      - "docs/deploy/**"
      - "docs/specs/ci-cd.md"
      - ".github/workflows/product-smoke.yml"
      - ".github/workflows/beta-deploy.yml"

jobs:
  beta-deploy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check beta deploy contract (Seam 1)
        run: bash scripts/check-beta-deploy-contract.sh

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  node4-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node4/package-lock.json
      - run: npm ci
      - run: npx tsx src/experts/reconcile-offers.test.ts
      - run: npx tsx src/node4-smoke.ts
        env:
          CI: "1"
